  <rect width="1600" height="900" fill="url(#poster)" />
  <g fill="#ededeb" stroke="#242424" stroke-width="8" paint-order="stroke" font-family="monospace" font-weight="700" font-size="460" text-anchor="middle" dominant-baseline="central">
    <text x="800" y="450">TEST</text>
  </g>
</svg>
