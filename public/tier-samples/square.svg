<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <title>Square TEST blue gradient crop sample</title>
  <defs>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf1f7" />
      <stop offset="0.5" stop-color="#3569ad" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#poster)" />
  <g fill="#ededeb" stroke="#242424" stroke-width="8" paint-order="stroke" font-family="monospace" font-weight="700" font-size="360" text-anchor="middle" dominant-baseline="central">
    <text x="280" y="300">T</text>
    <text x="720" y="300">E</text>
    <text x="280" y="740">S</text>
    <text x="720" y="740">T</text>
  </g>
</svg>
